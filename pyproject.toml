[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "framepulse-open"
version = "0.2.1"
description = "Local-first video and image annotation, director review, and an open media sidecar protocol"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "FramePulse contributors"}]
dependencies = [
  "numpy>=1.24,<3", "Pillow>=10,<13", "opencv-python-headless>=4.8,<5",
  "imageio-ffmpeg>=0.6,<0.7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "httpx>=0.27,<1", "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3,<2"]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
framepulse = "framepulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
framepulse = ["web/*", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
